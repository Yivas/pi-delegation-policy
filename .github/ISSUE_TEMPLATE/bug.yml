name: Bug report
description: Report a reproducible problem in the extension.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, session files, prompts, personal paths, and unredacted logs. Use private security reporting for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Package version or commit
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest sanitized configuration and steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
