name: Feature request
description: Propose a focused improvement to delegation policy or configuration.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private prompts, session files, personal paths, or operational configuration.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What delegation-policy workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest observable change that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any existing commands, presets, or Pi APIs you considered.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not require the package to create or run subagents itself.
          required: true
        - label: I searched existing issues for the same request.
          required: true
