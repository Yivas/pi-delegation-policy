name: Deploy documentation site

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/deploy-wiki.yml"
  pull_request:
    paths:
      - "wiki/**"
      - ".github/workflows/deploy-wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and upload the documentation site
        uses: withastro/action@v6
        with:
          path: ./wiki
          node-version: 24
          package-manager: npm
          build-cmd: npm run check && npm run build && npm run check:links

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
